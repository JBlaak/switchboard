<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Switchboard</title>
  <!-- renderer.css is what esbuild extracts from the bundle's CSS imports
       (xterm's stylesheet); style.css is the compiled SCSS. -->
  <link rel="stylesheet" href="renderer.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-container">
  <div id="sidebar" data-testid="sidebar">
    <div id="sidebar-header"></div>
    <div id="search-bar"></div>
    <div id="sidebar-content" data-testid="sidebar-content"></div>
    <div id="sidebar-footer" data-testid="sidebar-footer"></div>
  </div>
  <div id="sidebar-resize-handle" data-testid="sidebar-resize-handle"></div>
  <div id="main">
    <div id="placeholder" data-testid="empty-screen"></div>
    <div id="settings-viewer" style="display:none;"></div>
    <div id="terminal-area">
      <div id="terminal-header" data-testid="terminal-header" style="display:none;">
        <div id="terminal-header-info">
          <span id="terminal-header-name"></span>
          <span id="terminal-header-pty-title" style="display:none;"></span>
          <span id="terminal-header-id"></span>
          <span id="terminal-header-shell" style="display:none;"></span>
        </div>
        <div id="terminal-header-controls">
          <div id="terminal-header-questions" hidden></div>
          <span id="terminal-header-status"></span>
          <button id="terminal-stop-btn" title="Stop process"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="2" y="2" width="8" height="8" rx="1"/></svg></button>
        </div>
      </div>
      <div id="terminals"></div>
    </div>
  </div>
  </div><!-- /app-container -->
  <script src="renderer.js"></script>
</body>
</html>
