name: E2E

# On macOS, which costs ten times the minutes of Linux, so this runs only where it can catch
# something: on pull requests, not again on the push to main that merges one
# (the pull_request run already tested the merge result), and not when a pull
# request only touches the Android app, unit tests or docs.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'android/**'
      - 'test/**'
      - '**/*.md'
      - '.claude/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/test.yml'

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Playwright suite in e2e/: the built app, launched through Electron
  # against a fixture home, with fake `claude` and `ssh` on the session PATH.
  # macOS because the app is macOS-only (vibrancy, pmset, the zsh login shell
  # the fakes are put on PATH through) and the baselines are Mac pixels.
  # Pinned like build.yml: macos-latest stopped being assigned a runner.
  e2e:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install setuptools (node-gyp distutils fix)
        run: python -m pip install setuptools

      # postinstall rebuilds better-sqlite3 and node-pty for Electron's ABI,
      # which both the app and the fixture's database seeding need.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Screenshot comparisons are skipped here: the baselines are rendered on
      # a developer's Mac, and a runner's macOS version and GPU antialias text
      # differently enough to fail them without anything having changed. Every
      # functional assertion still runs. See "End-to-end tests" in CONTRIBUTING.md.
      - name: End-to-end tests
        run: npx playwright test --config e2e/playwright.config.ts
        env:
          SB_E2E_SKIP_SCREENSHOTS: '1'

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
