name: E2E

# On macOS, which costs ten times the minutes of Linux, so this runs only where it can catch
# something: on pull requests, not again on the push to main that merges one
# (the pull_request run already tested the merge result), and not when a pull
# request only touches the Android app, unit or component tests, or docs.
on:
    pull_request:
        branches: [main]
        paths-ignore:
            - 'android/**'
            - 'test/**'
            - 'component/**'
            - '**/*.md'
            - '.claude/**'
            - '.github/workflows/android.yml'
            - '.github/workflows/build.yml'
            - '.github/workflows/test.yml'

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
    group: e2e-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # The Playwright suite in e2e/: the built app, launched through Electron
    # against a fixture home, with fake `claude` and `ssh` on the session PATH.
    # macOS because the app is macOS-only (vibrancy, pmset, the zsh login shell
    # the fakes are put on PATH through).
    # Pinned like build.yml: macos-latest stopped being assigned a runner.
    #
    # One job: the suite is only what needs the wired-up app (about 40 tests);
    # the renderer's behaviour against main runs in the component suite on Linux
    # (test.yml). It used to be ~240 tests in three shards of about 5 minutes.
    e2e:
        runs-on: macos-15
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Install setuptools (node-gyp distutils fix)
              run: python -m pip install setuptools

            # postinstall rebuilds better-sqlite3 and node-pty for Electron's ABI,
            # which both the app and the fixture's database seeding need.
            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: End-to-end tests
              run: npx playwright test --config e2e/playwright.config.ts

            - name: Upload the report and traces
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 14
