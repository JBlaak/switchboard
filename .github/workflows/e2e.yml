name: E2E

# Only where it can catch something: on pull requests, not again on the push to main that merges one
# (the pull_request run already tested the merge result), and not when a pull
# request only touches the Android app, unit tests or docs.
on:
    pull_request:
        branches: [main]
        paths-ignore:
            - 'android/**'
            - 'test/**'
            - '**/*.md'
            - '.claude/**'
            - '.github/workflows/android.yml'
            - '.github/workflows/build.yml'
            - '.github/workflows/test.yml'

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
    group: e2e-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # The Playwright suite in e2e/: the built app, launched through Electron
    # against a fixture home, with fake `claude` and `ssh` on the session PATH.
    # On Linux under Xvfb, which costs a tenth of the minutes of macOS. The
    # screenshots are skipped (below), so what runs is the functional assertions,
    # which the harness makes behave the same on both (see "On Linux" in
    # CONTRIBUTING.md and e2e/support/launch.ts).
    #
    # Split in three shards: the suite (~240 tests, each launching the app) took
    # 14 minutes on a usual macOS runner, and a slow one ran every test about 1.7
    # times slower (#453 hit the 20-minute limit at 166 of 238). A shard took
    # about 5 minutes there, so a slow runner still has room.
    e2e:
        name: e2e (${{ matrix.shard }}/3)
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3]

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Install setuptools (node-gyp distutils fix)
              run: python -m pip install setuptools

            # Electron's GTK and NSS libraries, a display (Xvfb) and zsh, which the
            # fixture's profile puts the fake CLIs on PATH through. The same list as
            # "On Linux" in CONTRIBUTING.md.
            - name: Install Electron's libraries, Xvfb and zsh
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0t64 libgbm1 libxss1 libnss3 \
                      libasound2t64 libatk-bridge2.0-0t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
                      libxrandr2 libpango-1.0-0 libcups2t64 zsh

            # postinstall rebuilds better-sqlite3 and node-pty for Electron's ABI,
            # which both the app and the fixture's database seeding need.
            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            # Screenshot comparisons are skipped here: the baselines are rendered on
            # a developer's machine, and a runner's fonts and drivers draw text
            # differently enough to fail them without anything having changed. Every
            # functional assertion still runs. See "End-to-end tests" in CONTRIBUTING.md.
            - name: End-to-end tests
              run: xvfb-run -a -s "-screen 0 1920x1080x24" npx playwright test --config e2e/playwright.config.ts --shard=${{ matrix.shard }}/3
              env:
                  SB_E2E_SKIP_SCREENSHOTS: '1'

            - name: Upload the report and traces
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-report-${{ matrix.shard }}
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 14
