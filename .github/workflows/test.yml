name: Test

on:
  # Only main on push: a branch with a PR open would otherwise run the suite
  # twice for one commit, and the concurrency group below cannot dedupe
  # them because push and pull_request events carry different refs.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install setuptools (node-gyp distutils fix)
        run: python -m pip install setuptools

      # postinstall runs `electron-builder install-app-deps`, which rebuilds
      # better-sqlite3 against Electron's ABI — db-schema-reconcile.test.ts
      # loads the built DB module under Electron-as-Node and needs that.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # `npm test` would rebuild via pretest; the build above already did, and
      # keeping the steps separate says which one broke.
      - name: Test
        run: npx tsx --test test/*.test.ts

  # The Playwright suite in e2e/: the built app, launched through Electron
  # against a fixture home, with fake `claude` and `ssh` on the session PATH.
  # macOS because the app is macOS-only (vibrancy, pmset, the zsh login shell
  # the fakes are put on PATH through) and the baselines are Mac pixels.
  e2e:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install setuptools (node-gyp distutils fix)
        run: python -m pip install setuptools

      # postinstall rebuilds better-sqlite3 and node-pty for Electron's ABI,
      # which both the app and the fixture's database seeding need.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Screenshot comparisons are skipped here: the baselines are rendered on
      # a developer's Mac, and a runner's macOS version and GPU antialias text
      # differently enough to fail them without anything having changed. Every
      # functional assertion still runs. See "End-to-end tests" in the README.
      - name: End-to-end tests
        run: npx playwright test --config e2e/playwright.config.ts
        env:
          SB_E2E_SKIP_SCREENSHOTS: '1'

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
