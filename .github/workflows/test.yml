name: Test

on:
    # Only main on push: a branch with a PR open would otherwise run the suite
    # twice for one commit, and the concurrency group below cannot dedupe
    # them because push and pull_request events carry different refs.
    push:
        branches: [main]
    pull_request:
        branches: [main]

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
    group: test-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Check out
              uses: actions/checkout@v4

            # db-schema-reconcile.test.ts runs the built database module under
            # Electron-as-Node, so it needs the Electron build of better-sqlite3
            # that postinstall makes.
            - name: Install dependencies
              uses: ./.github/actions/install-dependencies

            - name: Typecheck
              run: npm run typecheck

            - name: Build
              run: npm run build

            # `npm test` would rebuild via pretest; the build above already did, and
            # keeping the steps separate says which one broke.
            - name: Test
              run: npx tsx --test test/*.test.ts
