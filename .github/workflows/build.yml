name: Package and release

# A version tag packages the Mac app (and the phone app) and drafts a GitHub
# release from them. Pull requests get the Mac package too, but only when they
# touch what goes into it: the macOS runner is expensive, and test.yml already
# builds the code on every pull request.
on:
    push:
        tags: ['v*']
    pull_request:
        branches: [main]
        paths:
            - 'package.json'
            - 'package-lock.json'
            - 'build/**'
            - 'scripts/**'
            - '.github/workflows/build.yml'
            - '.github/actions/**'

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The publish job creates the release.
permissions:
    contents: write

jobs:
    build:
        runs-on: macos-15

        steps:
            - name: Check out
              uses: actions/checkout@v4

            - name: Install dependencies
              uses: ./.github/actions/install-dependencies

            # electron-builder packages app/ (package.json "files"), so main,
            # preload, worker, renderer and styles are compiled into it first.
            - name: Compile into app/
              run: npm run build

            # The app isn't code-signed (see bundle-installer.ts). Turning
            # identity discovery off and passing no CSC_* variables keeps
            # electron-builder from looking for a certificate; an empty CSC_LINK
            # would be taken as a path and fail the build.
            - name: Package
              run: npx electron-builder --mac --publish never
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: false

            # A pull request run has nothing to publish, so a missing file is no error.
            - name: Keep the DMG, zip and update feed
              uses: actions/upload-artifact@v4
              with:
                  name: dist-mac
                  path: |
                      dist/*.dmg
                      dist/*.dmg.blockmap
                      dist/*.zip
                      dist/*.zip.blockmap
                      dist/latest*.yml
                  if-no-files-found: ignore
                  # The publish job picks these up within minutes; a pull request's
                  # DMG is only for trying out, so it need not sit in storage long.
                  retention-days: 3

    # The phone app ships with each release (#208). PR checks for it live in
    # android.yml, so this only runs on tags. Without the signing secrets it
    # leaves a notice and the release goes out without an APK.
    android:
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        steps:
            - name: Check out
              uses: actions/checkout@v4

            - name: Check for the signing secrets
              id: signing
              env:
                  KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: |
                  if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
                    echo "available=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "::notice::No Android signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD): the release goes out without an APK."
                    echo "available=false" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/setup-java@v4
              if: steps.signing.outputs.available == 'true'
              with:
                  distribution: temurin
                  java-version: 21

            - uses: gradle/actions/setup-gradle@v4
              if: steps.signing.outputs.available == 'true'

            - name: Decode the keystore
              if: steps.signing.outputs.available == 'true'
              env:
                  KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
              run: |
                  echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
                  echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

            - name: Build the signed APK
              if: steps.signing.outputs.available == 'true'
              working-directory: android
              env:
                  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: ./gradlew assembleRelease

            - name: Name the APK after the version
              if: steps.signing.outputs.available == 'true'
              run: |
                  version="$(jq -r .version package.json)"
                  mkdir -p dist
                  cp android/app/build/outputs/apk/release/app-release.apk "dist/Switchboard-${version}.apk"

            - name: Remove the keystore
              if: always() && steps.signing.outputs.available == 'true'
              run: rm -f "$RUNNER_TEMP/release.jks"

            - name: Upload the APK
              if: steps.signing.outputs.available == 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: android-apk
                  path: dist/*.apk
                  if-no-files-found: error

    publish:
        needs: [build, android]
        # Runs even when the APK build failed, so the Mac release still goes out;
        # the APK is attached only when its artifact is there.
        if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - name: Check out
              uses: actions/checkout@v4

            # Both jobs' artifacts land side by side in dist/.
            - name: Collect the Mac and Android builds
              uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true

            # A draft titled with the version, without notes: the /release command
            # writes them when it publishes the draft.
            - name: Draft the release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "${GITHUB_REF_NAME#v}" --notes ""
